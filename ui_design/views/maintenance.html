<!-- MAINTENANCE CASES VIEW -->
<div class="shrink-0 flex flex-row gap-6" style="max-height:36%;">
  <section class="flex-1 ice-card flex flex-col min-w-0">
    <div class="section-header">
      <div class="flex items-center gap-3">
        <i class="fas fa-wrench" style="color:var(--accent);"></i>
        <h2 class="section-title">MAINTENANCE</h2>
        <span class="section-badge" id="maint-count">LOADING...</span>
      </div>
      <div class="flex items-center gap-4">
        <div style="font-size:0.75rem; color:var(--muted);">
          Dedicated maintenance case management view
        </div>
      </div>
    </div>
    <!-- Workflow status quick-reference -->
    <div class="flex-1 overflow-y-auto cscroll min-h-0 p-4">
      <div class="flex flex-wrap gap-2" id="maint-workflow-pills">
        <!-- Populated by maintenanceController.js -->
      </div>
    </div>
  </section>

  <!-- Stat boxes -->
  <div class="shrink-0 flex flex-col gap-4 h-full" style="width: calc(18vh - 0.5rem);">
    <!-- Box 1: Open cases — orange -->
    <div class="ice-card flex-1" style="position:relative; container-type:inline-size; overflow:hidden;
             background: linear-gradient(160deg, rgba(234,88,12,0.25) 0%, rgba(251,146,60,0.08) 100%);
             border-color: rgba(251,146,60,0.35);">
      <span style="position:absolute; top:14%; left:8%; right:8%; text-align:center;
                   font-family:'Montserrat',sans-serif; font-size:max(0.55rem, 6cqi);
                   font-weight:800; text-transform:uppercase; letter-spacing:0.1em;
                   color:rgba(251,146,60,0.85); line-height:1.3;">Open Cases</span>
      <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:36cqi; font-weight:700;
                     color:#fb923c; line-height:1;
                     text-shadow: 0 0 24px rgba(251,146,60,0.55), 0 0 8px rgba(251,146,60,0.3);" id="stat-maint-open">–</span>
      </div>
    </div>
    <!-- Box 2: Closed cases — emerald -->
    <div class="ice-card flex-1" style="position:relative; container-type:inline-size; overflow:hidden;
             background: linear-gradient(160deg, rgba(5,150,105,0.25) 0%, rgba(74,222,128,0.08) 100%);
             border-color: rgba(74,222,128,0.35);">
      <span style="position:absolute; top:14%; left:8%; right:8%; text-align:center;
                   font-family:'Montserrat',sans-serif; font-size:max(0.55rem, 6cqi);
                   font-weight:800; text-transform:uppercase; letter-spacing:0.1em;
                   color:rgba(74,222,128,0.85); line-height:1.3;">Closed / Done</span>
      <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:42cqi; font-weight:700;
                     color:#4ade80; line-height:1;
                     text-shadow: 0 0 24px rgba(74,222,128,0.55), 0 0 8px rgba(74,222,128,0.3);" id="stat-maint-closed">–</span>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM: CASES TABLE + DETAILS -->
<section class="flex-1 ice-card flex flex-row min-h-0 overflow-hidden">
  <!-- Cases list -->
  <div class="flex flex-col min-h-0" style="width:64%; border-right:1px solid var(--border);">
    <div class="sub-header">
      <h3 class="sub-title">ALL MAINTENANCE CASES</h3>
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Filter (Customer, Status...)" id="maint-search" oninput="filterMaintenanceCases()">
      </div>
    </div>
    <div class="flex-1 overflow-y-auto cscroll min-h-0">
      <table class="orders-table">
        <thead>
          <tr>
            <th class="col-ico"></th>
            <th onclick="sortMaintenanceCases('name')">Customer <i class="fas fa-sort ml-1 opacity-40"></i></th>
            <th onclick="sortMaintenanceCases('caseCode')">Case Code <i class="fas fa-sort ml-1 opacity-40"></i></th>
            <th onclick="sortMaintenanceCases('status')">Status <i class="fas fa-sort ml-1 opacity-40"></i></th>
            <th onclick="sortMaintenanceCases('workflow')">Workflow <i class="fas fa-sort ml-1 opacity-40"></i></th>
          </tr>
        </thead>
        <tbody id="maint-cases-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Details panel -->
  <div class="flex flex-col relative" style="width:36%;">
    <div class="absolute top-4 right-4 z-10">
      <div class="status-dot"></div>
    </div>
    <div class="flex-1 overflow-y-auto cscroll p-7" id="maint-details-panel">
      <div class="det-empty">
        <i class="fas fa-wrench" style="font-size:2.5rem; opacity:0.25;"></i>
        <p style="font-size:0.85rem; font-weight:500;">Click a maintenance case to see its details!</p>
      </div>
    </div>
  </div>
</section>
