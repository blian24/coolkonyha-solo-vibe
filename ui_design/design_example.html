<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoolKonyha – Design Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #050d18;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Switcher Bar ─────────────────────────────── */
    #switcher-bar {
      flex-shrink: 0;
      height: 3rem;
      background: #0b1a2e;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      z-index: 100;
    }

    .switcher-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      white-space: nowrap;
    }

    .switcher-brand i { color: #0077B6; font-size: 0.85rem; }

    .switcher-sep {
      width: 1px;
      height: 1.25rem;
      background: rgba(255,255,255,0.10);
      flex-shrink: 0;
    }

    /* Custom dropdown */
    .design-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .design-select-wrap i {
      position: absolute;
      left: 0.75rem;
      font-size: 0.7rem;
      color: #0077B6;
      pointer-events: none;
    }

    #design-select {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 0.5rem;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 2.25rem 0.35rem 2rem;
      cursor: pointer;
      outline: none;
      min-width: 18rem;
      transition: border-color 0.2s, background 0.2s;
    }

    #design-select:hover {
      background: rgba(255,255,255,0.08);
      border-color: #0077B6;
    }

    #design-select option {
      background: #0b1a2e;
      color: #ffffff;
    }

    .design-select-caret {
      position: absolute;
      right: 0.75rem;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* Status chip */
    .design-chip {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      border: 1px solid;
      white-space: nowrap;
    }

    .chip-saved {
      color: #10b981;
      border-color: rgba(16,185,129,0.35);
      background: rgba(16,185,129,0.08);
    }

    .chip-wip {
      color: #f59e0b;
      border-color: rgba(245,158,11,0.35);
      background: rgba(245,158,11,0.08);
    }

    .switcher-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .switcher-hint {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.20);
      font-style: italic;
    }

    /* ── Design iframe ────────────────────────────── */
    #design-frame {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="switcher-bar">
    <div class="switcher-brand">
      <i class="fas fa-palette"></i>
      CoolKonyha Design Gallery
    </div>

    <div class="switcher-sep"></div>

    <div class="design-select-wrap">
      <i class="fas fa-layer-group"></i>
      <select id="design-select" onchange="switchDesign()">
        <option value="designs/design-01-oceanic.html" data-status="saved">01 · Oceanic Dark (v1)</option>
        <option value="designs/design-02-oceanic-v1.1.html" data-status="saved">02 · Oceanic S-Curve Layered (v1.1)</option>
        <option value="designs/design-03-oceanic-plus-v1.html" data-status="wip">03 · Oceanic Plus (v1)</option>
      </select>
      <i class="fas fa-chevron-down design-select-caret"></i>
    </div>

    <span class="design-chip chip-saved" id="design-status-chip">Mentve</span>

    <div class="switcher-right">
      <span class="switcher-hint">Válassz egy designt a legördülő menüből</span>
    </div>
  </div>

  <iframe id="design-frame" src="designs/design-01-oceanic.html"></iframe>

  <script>
    const STORAGE_KEY = 'ck_selected_design';

    function switchDesign() {
      const sel = document.getElementById('design-select');
      const src = sel.value;
      const status = sel.options[sel.selectedIndex].getAttribute('data-status');

      document.getElementById('design-frame').src = src;
      localStorage.setItem(STORAGE_KEY, src);

      const chip = document.getElementById('design-status-chip');
      if (status === 'saved') {
        chip.textContent = 'Mentve';
        chip.className = 'design-chip chip-saved';
      } else {
        chip.textContent = 'Kísérlet';
        chip.className = 'design-chip chip-wip';
      }
    }

    // Restore last selected design on page load
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const sel = document.getElementById('design-select');
      const opt = [...sel.options].find(o => o.value === saved);
      if (opt) {
        sel.value = saved;
        switchDesign();
      }
    }
  </script>

</body>
</html>
